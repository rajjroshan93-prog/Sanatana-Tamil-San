kind = "web"
previewPath = "/"
title = "Sanatana Dharma"
version = "1.0.0"
id = "artifacts/sanatana-dharma"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22339

[services.development]
run = "pnpm --filter @workspace/sanatana-dharma run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sanatana-dharma", "run", "build" ]
publicDir = "artifacts/sanatana-dharma/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22339"
BASE_PATH = "/"
